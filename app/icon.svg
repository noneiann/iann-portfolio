     accent rule the sections use as a divider. The glyph is outlined as a path
     (traced from Archivo Black, the display family the hero sets its name in)
     so it renders identically everywhere with no webfont to load.
     favicon.ico and apple-icon.png are rasterised from this same outline. -->
